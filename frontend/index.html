<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/coins/Taksmint FAVICON GREEN PNG.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description"
    content="TaskMint – Complete tasks, surveys and more to earn real rewards. Crypto, PayPal, Gift Cards and Discord Nitro." />
  <title>TaskMint – Earn Rewards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500;600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap"
    rel="stylesheet" />
  <style>
    html, body {
      background-color: #FAFAFA;
    }
    html.dark, html.dark body {
      background-color: #0C0E11;
    }
  </style>
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('taskmint_cookie_consent');
        var parsed = raw ? JSON.parse(raw) : null;
        if (parsed && parsed.functional) {
          var saved = localStorage.getItem('taskmint_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#0C0E11';
            return;
          }
        }
      } catch (e) {}
      document.documentElement.style.backgroundColor = '#FAFAFA';
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
